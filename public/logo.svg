<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sushi Art — Empório do Sushi">
  <defs>
    <linearGradient id="vinho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B2635"/>
      <stop offset="100%" stop-color="#611A1B"/>
    </linearGradient>
  </defs>

  <!-- disco vinho da marca -->
  <circle cx="256" cy="256" r="256" fill="url(#vinho)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#F5F1EA" stroke-opacity="0.35" stroke-width="2"/>

  <!-- hashi (pauzinhos) cruzados sobre o disco -->
  <g stroke="#F5F1EA" stroke-linecap="round" opacity="0.9">
    <line x1="150" y1="392" x2="366" y2="150" stroke-width="9"/>
    <line x1="188" y1="404" x2="392" y2="176" stroke-width="9"/>
  </g>
  <!-- pontas mais finas dos hashi -->
  <g stroke="#F5F1EA" stroke-linecap="round" opacity="0.9">
    <line x1="150" y1="392" x2="168" y2="372" stroke-width="5"/>
    <line x1="188" y1="404" x2="206" y2="384" stroke-width="5"/>
  </g>

  <!-- assinatura caligráfica -->
  <text x="256" y="268" text-anchor="middle" fill="#F5F1EA"
        font-family="Great Vibes, Segoe Script, cursive" font-size="132">Sushi Art</text>

  <!-- descritor -->
  <text x="256" y="318" text-anchor="middle" fill="#F5F1EA" fill-opacity="0.85"
        font-family="Playfair Display, Georgia, serif" font-size="26" letter-spacing="7">EMPÓRIO DO SUSHI</text>
</svg>
